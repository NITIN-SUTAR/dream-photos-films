[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API Redirects to Netlify Serverless Functions
[[redirects]]
  from = "/api/book"
  to = "/.netlify/functions/book"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# SPA routing fallback for React Vite frontend
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
